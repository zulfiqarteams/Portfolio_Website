        try {
          var raw = window.localStorage.getItem("urduTypingTutorial:settings");
          var settings = raw ? JSON.parse(raw) : null;
          var language = settings && (settings.language === "en" || settings.language === "ur" || settings.language === "roman") ? settings.language : "ur";
          document.documentElement.lang = language === "ur" ? "ur" : "en";
          document.documentElement.dir = language === "ur" ? "rtl" : "ltr";
        } catch (_) {
          document.documentElement.lang = "ur";
          document.documentElement.dir = "rtl";
        }
      })();
    </script>

    <!--
      GitHub Pages has no server-side routing, so a direct link or a
      refresh on any route other than "/" (e.g. /learn or /lesson/foo)
      would normally 404. public/404.html catches that 404 and redirects
      here with the real path encoded in the query string; this script
      decodes it and restores the correct URL via history.replaceState
      BEFORE React Router mounts, so the app boots on the right page.
      Based on the well-known rafgraph/spa-github-pages technique.
    -->
    <script>
      (function () {
        var query = window.location.search;
        if (query[1] === "/") {
          var decoded = query
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", window.location.pathname.slice(0, -1) + decoded + window.location.hash);
        }
      })();
    </script>
