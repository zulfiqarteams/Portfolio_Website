<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PakUrdu Typing mark: a keycap holding a stylised Urdu "پ" (Peh) —
       drawn as vector paths (not text) so it renders identically in
       every browser/OS regardless of installed Urdu fonts. -->
  <rect width="64" height="64" rx="14" fill="#0D6B5F" />
  <rect x="9" y="9" width="46" height="46" rx="10" fill="#FAF7F1" />
  <path
    d="M15 27 C15 39, 25 44, 32 44 C42 44, 49 38, 49 28"
    fill="none"
    stroke="#0D6B5F"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="25" cy="51" r="3" fill="#0D6B5F" />
  <circle cx="32" cy="53" r="3" fill="#0D6B5F" />
  <circle cx="39" cy="51" r="3" fill="#0D6B5F" />
</svg>
