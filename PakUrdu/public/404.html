<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PAKURDU — Redirecting…</title>
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this file for ANY unknown URL under this
      project (e.g. someone opens /Portfolio_Website/PakUrdu/learn
      directly, or refreshes on it). Since GH Pages can't rewrite
      requests to index.html the way a real server would, we redirect
      here instead, encoding the real path/query/hash into the query
      string. index.html's inline script decodes it and restores the
      correct URL via history.replaceState before React Router mounts,
      so the app boots on the right page with no visible flash.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // pathSegmentsToKeep = 2 because this app is deployed two levels
      // deep: /Portfolio_Website/PakUrdu/... — update this if the repo
      // or folder structure changes.
      var pathSegmentsToKeep = 2;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
