name: Deploy PakUrdu to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PakUrdu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PakUrdu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Production build
        run: npm run build

      - name: Verify generated deployment paths
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -R -n "/Z_"'Tech' dist; then
            echo "ERROR: stale legacy deployment reference found in dist"
            exit 1
          fi
          if ! grep -q "/Portfolio_Website/PakUrdu/" dist/index.html; then
            echo "ERROR: expected GitHub Pages base path is missing from dist/index.html"
            exit 1
          fi

      - name: Prepare Pages artifact
        working-directory: .
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/PakUrdu
          cp -R PakUrdu/dist/. _site/PakUrdu/
          if [ -f _site/PakUrdu/404.html ]; then
            cp _site/PakUrdu/404.html _site/404.html
          fi
          test -f _site/PakUrdu/index.html
          test -f _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
