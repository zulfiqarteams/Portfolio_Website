# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PakUrdu
        run: |
          cd PakUrdu
          npm install
          npm run build

      - name: Assemble deploy folder
        run: |
          mkdir -p _site
          rsync -av --exclude='PakUrdu' --exclude='.github' --exclude='_site' --exclude='node_modules' ./ _site/
          rm -rf _site/PakUrdu
          mkdir -p _site/PakUrdu
          cp -r PakUrdu/dist/. _site/PakUrdu/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
