name: Deploy Portfolio and PakUrdu to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PakUrdu/package-lock.json

      - name: Install PakUrdu dependencies
        working-directory: PakUrdu
        run: npm ci

      - name: Build PakUrdu
        working-directory: PakUrdu
        run: npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p pages

          # Copy portfolio website files
          cp index.html pages/
          cp app.js pages/
          cp -r styles pages/
          cp -r img pages/

          # Copy other portfolio projects/directories
          cp -r Riwaayah pages/
          cp -r Weather_APP pages/
          cp -r To_Do_List_App pages/
          cp -r "Tree Builder" pages/
          cp -r Zulfiqar_Restuarant pages/

          # Deploy built PakUrdu application
          mkdir -p pages/PakUrdu
          cp -r PakUrdu/dist/* pages/PakUrdu/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
