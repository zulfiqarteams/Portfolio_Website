name: Deploy Portfolio and PakUrdu to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PakUrdu dependencies (generate lockfile if missing)
        working-directory: PakUrdu
        run: |
          # Ensure a package-lock.json exists and then install exactly from it
          npm install --package-lock-only
          npm ci

      - name: Possibly commit generated package-lock.json
        run: |
          if [ -f PakUrdu/package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PakUrdu/package-lock.json
            git commit -m "chore(PakUrdu): add package-lock.json [skip ci]" || echo "no changes to commit"
            git push || echo "push failed (likely no permission)"
          fi

      - name: Build PakUrdu
        working-directory: PakUrdu
        run: npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p pages

          # Copy portfolio website files
          cp index.html pages/
          cp app.js pages/
          cp -r styles pages/
          cp -r img pages/

          # Copy other portfolio projects/directories
          cp -r Riwaayah pages/ || true
          cp -r Weather_APP pages/ || true
          cp -r To_Do_List_App pages/ || true
          cp -r "Tree Builder" pages/ || true
          cp -r Zulfiqar_Restuarant pages/ || true

          # Deploy built PakUrdu application
          mkdir -p pages/PakUrdu
          cp -r PakUrdu/dist/* pages/PakUrdu/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
