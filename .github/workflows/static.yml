name: Deploy Portfolio and PakUrdu to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PakUrdu/package-lock.json

      - name: Install PakUrdu dependencies
        working-directory: PakUrdu
        run: npm ci

      - name: Build PakUrdu
        working-directory: PakUrdu
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p pages

          # Copy existing portfolio website
          cp -r . pages/portfolio

          # Put PakUrdu at /Portfolio_Website/PakUrdu/
          mkdir -p pages/portfolio/PakUrdu
          cp -r PakUrdu/dist/* pages/portfolio/PakUrdu/

          # Remove unnecessary source/build files from deployment
          rm -rf pages/portfolio/PakUrdu/src
          rm -rf pages/portfolio/PakUrdu/node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/portfolio

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
