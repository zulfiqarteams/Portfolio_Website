<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Riwayat Collections</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
<script>
  const currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if (!currentUser) {
    window.location.href = 'Login.html';
  }
</script>
<div class="navbar">
  <div class="brand">Riwayat Collections</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="wishList.html">Wishlist</a>
    <a href="Orders.html">My Orders</a>
    <a href="Cart.html" style="position: relative;">
      Cart
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </div>
</div>

<div class="container">
  <div class="checkout-container">
    <h2 class="section-title">Checkout</h2>
    
    <div class="checkout-grid">
      
      <div class="form-section">
        <h3 style="margin-top: 0; margin-bottom: 24px;">Shipping Details</h3>
        
        <form id="checkout-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
          </div>
          
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
          </div>
          
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="your@email.com">
          </div>
          
          <div class="form-group">
            <label>Shipping Address</label>
            <textarea id="address" rows="4" placeholder="Enter your complete address" required></textarea>
          </div>
          
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="City name" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Postal Code</label>
              <input type="text" id="postal" placeholder="54000" required>
            </div>
            <div class="form-group">
              <label>Payment Method</label>
              <select id="payment" style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; background: white;">
                <option value="cod">Cash on Delivery</option>
              </select>
            </div>
          </div>
          
          <button type="submit" class="btn" style="width: 100%; margin-top: 16px;">
            Place Order
          </button>
        </form>
      </div>
      
      <div class="order-summary-section">
        <h3 style="margin-top: 0; margin-bottom: 20px;">Order Summary</h3>
        <div id="order-items"></div>
        <div style="border-top: 2px solid #e5e7eb; margin-top: 16px; padding-top: 16px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: #6b7280;">Subtotal</span>
            <span id="subtotal">Rs 0</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span style="color: #6b7280;">Shipping</span>
            <span style="color: #10b981;">Free</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb;">
            <span style="font-weight: 600;">Total</span>
            <span id="total-price" style="font-weight: 700; font-size: 20px;">Rs 0</span>
          </div>
        </div>
      </div>
      
    </div>
  </div>
</div>

<div id="success-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
  <div style="background: white; padding: 48px; border-radius: 24px; text-align: center; max-width: 400px; width: 90%;">
    <div style="width: 80px; height: 80px; background: #d1fae5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2 style="margin-bottom: 12px;">Order Placed!</h2>
    <p style="color: #6b7280; margin-bottom: 24px;">Thank you for your purchase. Your order has been received and is being processed.</p>
    <div style="display: flex; gap: 12px;">
      <a href="orders.html" class="btn" style="flex: 1; text-decoration: none;">View Orders</a>
      <a href="index.html" class="btn" style="flex: 1; background: #f3f4f6; color: #374151; text-decoration: none;">Continue Shopping</a>
    </div>
  </div>
</div>

<script type="module" src="./js/checkout.js"></script>

</body>
</html>
