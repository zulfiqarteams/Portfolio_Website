<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <title>Login - Riwayat Collections</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <a href="index.html" aria-label="Close" style="position: absolute; top: 20px; right: 20px; color: var(--text-muted); display: flex; padding: 6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </a>
    <div class="auth-logo">
      <h1>Riwayat Collections</h1>
      <p>Welcome back! Please sign in to continue.</p>
    </div>

    <div class="auth-error" id="error-msg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-text"></span>
    </div>

    <div class="auth-success" id="success-msg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="success-text"></span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="switchTab('login', this)">Sign In</button>
      <button class="auth-tab" data-tab="register" onclick="switchTab('register', this)">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="email" id="login-email" placeholder="your@email.com" required>
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="login-password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn" id="login-btn">
        Sign In
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
      <div class="input-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" id="reg-name" placeholder="John Doe" required>
        </div>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="email" id="reg-email" placeholder="your@email.com" required>
        </div>
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <input type="tel" id="reg-phone" placeholder="03XX-XXXXXXX" required>
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="reg-password" placeholder="Min 6 characters" required minlength="6">
          <button type="button" class="password-toggle" onclick="togglePassword('reg-password')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn" id="reg-btn">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      <p>By signing in, you agree to our Terms & Privacy Policy</p>
    </div>
  </div>
</div>

<script type="module">
import { registerUser, loginUser } from "./js/auth.js";
import { auth } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

window.switchTab = switchTab;
window.togglePassword = togglePassword;
window.handleLogin = handleLogin;
window.handleRegister = handleRegister;

function switchTab(tab, clickedEl) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

  const tabBtn = clickedEl || document.querySelector(`.auth-tab[data-tab="${tab}"]`);
  if (tabBtn) tabBtn.classList.add('active');
  document.getElementById(tab + '-form').classList.add('active');

  hideMessages();
}

function togglePassword(inputId) {
  const input = document.getElementById(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-msg').style.display = 'flex';
  document.getElementById('success-msg').style.display = 'none';
}

function showSuccess(msg) {
  document.getElementById('success-text').textContent = msg;
  document.getElementById('success-msg').style.display = 'flex';
  document.getElementById('error-msg').style.display = 'none';
}

function hideMessages() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('success-msg').style.display = 'none';
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : '';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) {
    return 'Invalid email or password';
  }
  if (code.includes('email-already-in-use')) return 'Email already registered. Please sign in.';
  if (code.includes('weak-password')) return 'Password should be at least 6 characters';
  if (code.includes('invalid-email')) return 'Please enter a valid email address';
  return 'Something went wrong. Please try again.';
}

async function handleLogin(e) {
  e.preventDefault();
  hideMessages();

  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const { profile } = await loginUser(email, password);
    showSuccess('Login successful! Redirecting...');
    setTimeout(() => {
      window.location.href = (profile && profile.role === 'admin') ? 'admin.html' : 'index.html';
    }, 800);
  } catch (err) {
    showError(friendlyAuthError(err));
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  hideMessages();

  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  const btn = document.getElementById('reg-btn');

  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    await registerUser({ name, email, phone, password });
    showSuccess('Account created! Please sign in.');
    setTimeout(() => {
      switchTab('login', document.querySelector('.auth-tab[data-tab="login"]'));
      document.getElementById('login-email').value = email;
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }, 1200);
  } catch (err) {
    showError(friendlyAuthError(err));
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}

// Already signed in? Skip straight past the login screen.
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('admin') === 'true') return; // explicit re-login requested
  const { getUserProfile } = await import('./js/auth.js');
  const profile = await getUserProfile(user.uid);
  window.location.href = (profile && profile.role === 'admin') ? 'admin.html' : 'index.html';
});
</script>

<script type="module" src="./js/chatbot.js"></script>
<script src="./js/ui.js"></script>
</body>
</html>
