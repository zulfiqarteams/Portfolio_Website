<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Riwayat Collections</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
  <script>
  const currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if (!currentUser) {
    window.location.href = 'Login.html';
  }
</script>

<div class="navbar">
  <div class="brand">Riwayat Collections</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="wishList.html">Wishlist</a>
    <a href="Orders.html">My Orders</a>
    <a href="Cart.html" style="position: relative;">
      Cart
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </div>
</div>

<div class="container">
  <div class="cart-container">
    <h2 class="section-title">Shopping Cart</h2>
    <div id="cart-items"></div>
    <div id="cart-empty" class="empty-cart-message hidden">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <p style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">Your cart is empty</p>
      <p style="margin-bottom: 24px;">Looks like you haven't added anything yet</p>
      <a href="index.html" class="btn" style="text-decoration: none;">Continue Shopping</a>
    </div>
    <div id="cart-total-section" class="cart-total-section hidden">
      <div>
        <span style="color: #6b7280;">Total</span>
        <div id="cart-total" style="font-size: 24px; font-weight: 700;">Rs 0</div>
      </div>
      <a href="checkout.html" class="btn" style="text-decoration: none;">Proceed to Checkout</a>
    </div>
  </div>
</div>

<script type="module" src="./js/cart.js"></script>

</body>
</html>
