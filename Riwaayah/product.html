<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Riwayat Collections</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

<div class="navbar">
  <div class="brand">Riwayat Collections</div>
  <div class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
    <a href="wishList.html">Wishlist</a>
    <a href="Orders.html">My Orders</a>
    <a href="Cart.html" style="position: relative;">
      Cart
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
    <a href="Login.html" id="login-link">Sign In</a>
    <a href="#" onclick="logoutUser()" id="logout-link" style="display: none;">Logout</a>
  </div>
</div>

<div class="container">
  <div id="product-detail" style="min-height: 400px;">
    <div class="skeleton fast-skeleton" style="height: 500px; border-radius: 16px;"></div>
  </div>
</div>

<script>
const currentUser = JSON.parse(localStorage.getItem('currentUser'));
if (currentUser) {
  document.getElementById('login-link').style.display = 'none';
  document.getElementById('logout-link').style.display = 'inline';
  if (currentUser.role === 'admin') {
    document.getElementById('admin-link').style.display = 'inline';
  }
}
function logoutUser() {
  localStorage.removeItem('currentUser');
  window.location.reload();
}
</script>

<script type="module" src="./js/product.js"></script>

</body>
</html>
